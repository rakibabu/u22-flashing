<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0F0B3E">
    <title>Training uitvoeren · Flashing</title>
    <style>
        :root { --navy:#0F1075; --orange:#ea6d20; --paper:#fff; --ink:#101033; --muted:#65657a; --line:#e5e5ed; }
        * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font:16px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; }
        .app { min-height:100vh; max-width:672px; margin:auto; padding-bottom:196px; } .hero { padding:calc(16px + env(safe-area-inset-top)) 16px 16px; background:var(--navy); color:white; border-radius:0 0 14px 14px; }
        .eyebrow,.label { margin:0; color:var(--orange); text-transform:uppercase; letter-spacing:.03em; font-size:.75rem; font-weight:700; }.eyebrow { color:rgb(255 255 255 / .7); text-transform:none; letter-spacing:0; font-weight:400; }.headline { margin:9px 0 0; font-size:2rem; line-height:1.15; letter-spacing:-.025em; }.status { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:9px; color:rgb(255 255 255 / .7); font-size:.875rem; }.dot { display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:100%; background:var(--orange); }.timer { font-variant-numeric:tabular-nums; font-size:1.5rem; font-weight:500; color:#fff; }
        main { padding:20px 16px; } .block-count { color:var(--muted); font-size:.875rem; font-weight:600; }.card { margin-top:22px; padding:0; border:0; border-radius:0; background:transparent; box-shadow:none; }.card p { margin:4px 0 0; white-space:pre-line; }.coaching { padding:16px; border-radius:12px; background:#f2f2ff; }.points { margin:8px 0 0; padding-left:20px; }.points li+li { margin-top:5px; }.next { padding:12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--muted); font-size:.875rem; }.next .label { margin-bottom:4px; }.next strong { color:var(--ink); }
        .controls { position:fixed; z-index:2; right:0; bottom:0; left:0; padding:12px 12px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:rgb(255 255 255 / .97); box-shadow:0 -8px 20px rgb(16 16 51 / .06); }.controls-inner { max-width:672px; margin:auto; }.actions { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }.button { min-height:48px; border:1px solid #dedee7; border-radius:12px; padding:10px 12px; background:#fff; color:#282832; font:inherit; font-size:1rem; font-weight:600; cursor:pointer; box-shadow:0 1px 2px rgb(16 16 51 / .08); }.button:disabled { opacity:.4; cursor:not-allowed; }.button.primary { border-color:var(--orange); background:var(--orange); color:white; }.button.orange { background:#fff; color:#282832; }.secondary { display:flex; gap:8px; margin-top:8px; }.secondary .button { flex:1; min-height:42px; font-size:.875rem; }.note { display:flex; gap:8px; margin-top:10px; }.note input { min-width:0; flex:1; min-height:44px; border:1px solid #dedee7; border-radius:12px; padding:0 12px; color:var(--ink); font:inherit; }.notice { display:none; margin:12px 16px 0; padding:12px 14px; border-radius:12px; background:#e9f7f0; color:#075a3c; font-size:.9rem; font-weight:700; }.empty { padding:20vh 28px; color:white; background:var(--navy); min-height:100vh; }.empty h1 { font-size:2.5rem; line-height:.95; }.hidden { display:none!important; }
    </style>
</head>
<body>
    <div id="empty" class="empty hidden"><p class="eyebrow">Flashing Heiloo</p><h1>Deze training staat niet op dit toestel.</h1><p>Open de training één keer online en kies daarna ‘Maak offline beschikbaar’.</p></div>
    <div id="app" class="app hidden">
        <header class="hero"><p class="eyebrow">Offline trainingsmodus</p><h1 id="title" class="headline"></h1><div class="status"><span id="counter"></span><span class="timer" id="timer">00:00</span></div><div class="status"><span><i class="dot"></i>Lokale voortgang</span><span id="sync-status">Offline</span></div></header>
        <p id="notice" class="notice"></p>
        <main><p id="block-label" class="block-count"></p><section class="card"><p class="label">Doel</p><p id="objective">—</p></section><section class="card"><p class="label">Organisatie</p><p id="organization">—</p></section><section class="card"><p class="label">Uitvoering</p><p id="execution">—</p></section><section class="card coaching"><p class="label">Coaching points</p><ul id="points" class="points"></ul></section><section id="next-card" class="card next"><p class="label">Hierna</p><p id="next"></p></section></main>
        <footer class="controls"><div class="controls-inner"><div class="actions"><button id="previous" class="button">Vorige</button><button id="pause" class="button primary">Pauze</button><button id="next-button" class="button orange">Volgende</button></div><div class="secondary"><button id="add-time" class="button">+2 minuten</button><button id="skip" class="button">Overslaan</button><button id="sync" class="button">Synchroniseren</button></div><div class="note"><input id="note" placeholder="Korte coachnotitie"><button id="save-note" class="button primary">Bewaar</button></div></div></footer>
    </div>
    <script>
        const DB='flashing-training-offline', id=Number((location.pathname.match(/trainingen\/(\d+)/)||[])[1]), byId=id=>document.getElementById(id);
        let training, progress, now=Date.now();
        const open=()=>new Promise((resolve,reject)=>{const req=indexedDB.open(DB,3);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('trainings'))db.createObjectStore('trainings',{keyPath:'id'});if(!db.objectStoreNames.contains('events'))db.createObjectStore('events',{keyPath:'uuid'});if(!db.objectStoreNames.contains('progress'))db.createObjectStore('progress',{keyPath:'training_id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
        const read=async(store,key)=>{const db=await open();return new Promise(resolve=>{const req=db.transaction(store).objectStore(store).get(key);req.onsuccess=()=>resolve(req.result)})};
        const write=async(store,value)=>{const db=await open(),transaction=db.transaction(store,'readwrite');return new Promise((resolve,reject)=>{transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error);transaction.onabort=()=>reject(transaction.error);transaction.objectStore(store).put(value)})};
        const events=async()=>{const db=await open();return new Promise(resolve=>{const req=db.transaction('events').objectStore('events').getAll();req.onsuccess=()=>resolve(req.result.filter(event=>event.training_id===training.id))})};
        const elapsed=(start,pausedAt,paused,total=0)=>Math.max(0,Math.floor(((paused?new Date(pausedAt):new Date(now))-new Date(start))/1000)-total);
        const format=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
        const save=async()=>{await write('progress',progress)};
        const queue=async(type,payload={})=>{const event={uuid:crypto.randomUUID(),training_id:training.id,sequence:(progress.sequence||0)+1,type,block_id:training.blocks[progress.current_index].id,payload};progress.sequence=event.sequence;await write('events',event);await save()};
        const flash=message=>{const el=byId('notice');el.textContent=message;el.style.display='block';setTimeout(()=>el.style.display='none',2800)};
        function render(){const block=training.blocks[progress.current_index],snapshot=block.snapshot||{},next=training.blocks[progress.current_index+1];byId('title').textContent=training.title;byId('counter').textContent=`Blok ${progress.current_index+1} van ${training.blocks.length}`;byId('block-label').textContent=block.title;byId('objective').textContent=snapshot.objective||'—';byId('organization').textContent=snapshot.organization||'—';byId('execution').textContent=snapshot.execution||'—';byId('points').replaceChildren(...(snapshot.coaching_points||['Geen coaching points opgeslagen.']).map(point=>{const li=document.createElement('li');li.textContent=point;return li}));byId('next-card').style.display=next?'block':'none';if(next)byId('next').textContent=`${next.title} · ${next.planned_duration_minutes} min`;byId('previous').disabled=progress.current_index===0;byId('next-button').textContent=next?'Volgende':'Afronden';byId('pause').textContent=progress.paused_at?'Hervat':'Pauze';byId('note').value=progress.block_notes[block.id]||'';byId('sync-status').textContent=navigator.onLine?'Klaar om te syncen':'Offline'}
        function tick(){now=Date.now();const block=training.blocks[progress.current_index];const left=Math.max(0,block.planned_duration_minutes*60+progress.block_added_seconds-elapsed(progress.block_started_at,progress.paused_at,Boolean(progress.paused_at)));byId('timer').textContent=format(left)}
        async function change(next,skipped=false){await queue(skipped?'skip':'complete');if(next<training.blocks.length){progress.current_index=next;progress.block_started_at=new Date().toISOString();progress.block_added_seconds=0;progress.paused_at=null;await save();render()}else{flash('Training lokaal afgerond. Synchroniseer zodra je online bent.');byId('next-button').disabled=true}}
        async function sync(){if(!navigator.onLine){flash('Nog geen verbinding. Je voortgang blijft lokaal bewaard.');return}const queued=await events();if(!queued.length){flash('Alles is al gesynchroniseerd.');return}try{const response=await fetch(training.sync_url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-TOKEN':training.csrf_token,'Accept':'application/json'},body:JSON.stringify({events:queued.map(({uuid,sequence,type,block_id,payload})=>({uuid,sequence,type,block_id,payload}))})});if(!response.ok)throw new Error();const db=await open(),transaction=db.transaction('events','readwrite');queued.forEach(event=>transaction.objectStore('events').delete(event.uuid));flash(`${queued.length} wijziging(en) gesynchroniseerd.`)}catch{flash('Synchroniseren lukt nog niet; probeer later opnieuw.')}}
        (async()=>{training=await read('trainings',id);progress=await read('progress',id);if(!training||!progress){byId('empty').classList.remove('hidden');return}byId('app').classList.remove('hidden');render();tick();setInterval(tick,1000);byId('previous').onclick=async()=>{if(progress.current_index){progress.current_index--;progress.block_started_at=new Date().toISOString();progress.block_added_seconds=0;await save();render()}};byId('pause').onclick=async()=>{if(progress.paused_at){progress.total_paused_seconds+=(new Date()-new Date(progress.paused_at))/1000;progress.paused_at=null}else progress.paused_at=new Date().toISOString();await save();render()};byId('next-button').onclick=()=>change(progress.current_index+1);byId('skip').onclick=()=>change(progress.current_index+1,true);byId('add-time').onclick=async()=>{progress.block_added_seconds+=120;await queue('add_time',{seconds:120});flash('2 minuten toegevoegd.');tick()};byId('save-note').onclick=async()=>{const note=byId('note').value.trim(),block=training.blocks[progress.current_index];progress.block_notes[block.id]=note;await queue('note',{notes:note});flash('Notitie lokaal bewaard.')};byId('sync').onclick=sync;addEventListener('online',sync)})();
    </script>
</body>
</html>
